# Bring-your-own App Gateway for Containers: Terraform created the gateway, its "public" frontend and the WAF policy.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  annotations:
    alb.networking.azure.io/alb-id: /subscriptions/69e37b9b-69e4-49f1-b90a-b3a4b981fdbb/resourceGroups/rg-bap-sbx-eus2-aks/providers/Microsoft.ServiceNetworking/trafficControllers/agc-bap-sbx-eus2
spec:
  gatewayClassName: azure-alb-external
  addresses:
    - type: alb.networking.azure.io/alb-frontend
      value: public
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
spec:
  parentRefs:
    - name: public
  rules:
    - backendRefs:
        - name: echo
          port: 80
---
apiVersion: alb.networking.azure.io/v1
kind: WebApplicationFirewallPolicy
metadata:
  name: echo
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: echo
    namespace: echo
  webApplicationFirewall:
    id: /subscriptions/69e37b9b-69e4-49f1-b90a-b3a4b981fdbb/resourceGroups/rg-bap-sbx-eus2-aks/providers/Microsoft.Network/ApplicationGatewayWebApplicationFirewallPolicies/wafp-bapsbxeus2agc
