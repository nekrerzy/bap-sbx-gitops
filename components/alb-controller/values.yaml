# ALB controller chart values. Client ID = Terraform output workload_identity_client_ids["alb-controller"].
albController:
  namespace: azure-alb-system
  podIdentity:
    clientID: 3dfefaa0-efd4-420c-a647-13b76df6d489
  controller:
    nodeSelector:
      bap.io/pool: platform
    tolerations:
      - { key: bap.io/pool, operator: Equal, value: platform, effect: NoSchedule }
