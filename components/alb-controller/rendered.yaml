# Source: alb-controller/templates/alb-controller-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alb-controller
  namespace:  azure-alb-system
  labels:
    app: alb-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alb-controller
  template:
    metadata:
      labels:
        app: alb-controller
        azure.workload.identity/use: "true"
        sidecar.istio.io/inject: 'false'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8001'
        kubernetes.azure.com/set-kube-service-host-fqdn: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.azure.com/cluster
                operator: Exists
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
              - key: type
                operator: NotIn
                values:
                - virtual-kubelet
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - alb-controller
              topologyKey: kubernetes.io/hostname
            weight: 100
      priorityClassName: system-node-critical
      serviceAccountName: alb-controller-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      nodeSelector:
        bap.io/pool: platform
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 6000
      - key: bap.io/pool
        operator: Equal
        effect: NoSchedule
        value: platform
      initContainers:
      # This container installs the CRDs required by alb controller on the cluster
        - name: init-alb-controller-crds
          image: "mcr.microsoft.com/application-lb/images/alb-controller-crds:1.12.2"
          imagePullPolicy:  IfNotPresent
          command:
          - kubectl
          - apply
          - -f
          - /alb-controller-crds/agc-crds
          - -f
          - /alb-controller-crds/gateway-api-crds
          - -f
          - /alb-controller-crds/extra-crds/alb.networking.azure.io_webapplicationfirewallpolicy.yaml
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
      # This container installs the default CR's required by alb controller on the cluster
        - name: init-alb-controller-bootstrap
          image:  "mcr.microsoft.com/application-lb/images/alb-controller-bootstrap:1.12.2"
          imagePullPolicy:  IfNotPresent
          command: ['/alb-controller-bootstrap']
          args: [
          ]
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
      containers:
        - name: alb-controller
          image: "mcr.microsoft.com/application-lb/images/alb-controller:1.12.2"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: "http"
              containerPort: 8000
              protocol: TCP
            - name: "metrics"
              containerPort: 8001
              protocol: TCP
            - name: "health"
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          command: ['/alb-controller']
          env:
          - name: AZURE_CLIENT_ID
            value: 9bf3f56e-8b51-4f63-bd47-f512d2abf0d6
          args: [
            "--log-level", "info",
            "--namespace", "azure-alb-system",
            "--cloud-environment", "AzureCloud",
            "--alb-security-policy-feature-flag=true",
          ]
          resources:
            limits:
              cpu: "400m"
              memory: "400Mi"
            requests:
              cpu: "100m"
              memory: "200Mi"
