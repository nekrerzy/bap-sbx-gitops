# ALB controller: programs Application Gateway for Containers from Gateway API objects.
# Rendered from Microsoft's chart and patched for the AKS "no privilege escalation" policy (components/alb-controller).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alb-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/nekrerzy/bap-sbx-gitops.git
    targetRevision: main
    path: components/alb-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: azure-alb-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
